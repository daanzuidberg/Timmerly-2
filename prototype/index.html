<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timmerly — werk voor zzp-timmermannen</title>
<!-- Gegenereerd uit design/ met `node tools/build.js` — niet handmatig bewerken. -->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#F2F3F5;color:#0C1A2A;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:#D4531A;text-decoration:none}
  a:hover{color:#F26522}
  button{font-family:inherit}
  input,select,textarea{font-family:inherit}
  @keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
  footer a:hover{color:#F26522}
</style>
</head>
<body>
<div id="app"></div>

<template id="dc-template">
<sc-if value="{{ isPublic }}" hint-placeholder-val="{{ true }}">
<div style="background:#FFFFFF;min-height:100vh;display:flex;flex-direction:column">
  <nav style="position:sticky;top:0;z-index:50;background:#FFFFFF;border-bottom:1px solid #DCE0E6;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap">
    <button onClick="{{ goLanding }}" style="display:inline-flex;align-items:center;gap:11px;background:none;border:none;cursor:pointer;padding:0">
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" fill="#0C1A2A"></rect><path d="M9.5 7.5h4.2v11.3h9.8v4.2H9.5z" fill="#F26522"></path></svg>
      <span style="display:inline-flex;align-items:baseline;gap:9px">
        <span style="font-size:1.22rem;font-weight:700;letter-spacing:-.4px;color:#0C1A2A">Timmerly</span>
        <span style="font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8A93A3;border-left:1px solid #DCE0E6;padding-left:9px;white-space:nowrap">Voor de bouw</span>
      </span>
    </button>
    <div style="display:flex;align-items:center;gap:8px;font-size:.92rem;font-weight:600;flex-wrap:wrap">
      <sc-for list="{{ pubNav }}" as="n" hint-placeholder-count="4">
        <button onClick="{{ n.go }}" style="{{ n.style }}">{{ n.label }}</button>
      </sc-for>
    </div>
    <div style="display:flex;gap:10px;white-space:nowrap">
      <button onClick="{{ goPro }}" style="padding:10px 20px;border-radius:2px;border:1px solid #DCE0E6;background:#fff;color:#0C1A2A;font-weight:600;font-size:.9rem;cursor:pointer">Inloggen</button>
      <button onClick="{{ goOnboard }}" style="padding:10px 22px;border-radius:2px;border:none;background:#F26522;color:#fff;font-weight:600;font-size:.9rem;cursor:pointer">Word Timmerly-vakman</button>
    </div>
  </nav>

  <sc-if value="{{ isLanding }}" hint-placeholder-val="{{ true }}">
  <div data-screen-label="Homepage">
    <div style="background:#0C1A2A;padding:72px 24px 80px">
      <div style="max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:48px;align-items:center">
        <div>
          <div style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#FCD34D;padding:6px 16px;border-radius:2px;font-size:.82rem;font-weight:600;margin-bottom:22px">Voor zzp-timmermannen in Nederland</div>
          <h1 style="font-size:clamp(2.1rem,4.6vw,3.3rem);font-weight:600;color:#fff;line-height:1.1;letter-spacing:-1.4px;margin:0 0 16px;text-wrap:pretty">Goede bouwprojecten,<br /><span style="color:#F26522">zonder eindeloos zoeken.</span></h1>
          <p style="font-size:1.08rem;color:rgba(255,255,255,.8);max-width:560px;margin:0 0 32px;text-wrap:pretty">Maak één keer je profiel. Timmerly toont projecten die passen bij je vak, regio en beschikbaarheid, screent beide kanten en regelt de match en de afhandeling.</p>
          <div style="display:flex;gap:12px;flex-wrap:wrap">
            <button onClick="{{ goProjects }}" style="padding:15px 26px;border-radius:2px;border:none;background:#F26522;color:#fff;font-weight:700;font-size:1rem;cursor:pointer">Bekijk projecten</button>
            <button onClick="{{ goOnboard }}" style="padding:15px 26px;border-radius:2px;border:1.5px solid rgba(255,255,255,.55);background:none;color:#fff;font-weight:700;font-size:1rem;cursor:pointer">Word Timmerly-vakman</button>
          </div>
          <div style="margin-top:28px;font-size:.84rem;color:rgba(255,255,255,.6)">Gratis voor vakmensen · Aanmelden in 10 minuten · Persoonlijk aanspreekpunt</div>
        </div>
        <div style="background:#fff;border:1px solid #DCE0E6;border-radius:2px;padding:24px;max-width:440px;justify-self:end;width:100%;box-sizing:border-box">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px">
            <span style="font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#8A93A3;font-weight:700;">Actueel project</span>
            <span style="{{ heroProject.pill }}">{{ heroProject.status }}</span>
          </div>
          <div style="font-size:1.25rem;font-weight:700;letter-spacing:-.3px;margin-bottom:6px">{{ heroProject.title }}</div>
          <div style="font-size:.9rem;color:#6B7280;margin-bottom:16px">{{ heroProject.meta }}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px">
            <sc-for list="{{ heroProject.work }}" as="w" hint-placeholder-count="3">
              <span style="background:#F2F3F5;border:1px solid #DCE0E6;color:#0C1A2A;padding:4px 10px;border-radius:2px;font-size:.78rem;font-weight:700">{{ w }}</span>
            </sc-for>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
            <span style="font-weight:700;font-size:.95rem">{{ heroProject.rate }}</span>
            <button onClick="{{ heroProject.open }}" style="padding:11px 18px;border-radius:2px;border:none;background:#0C1A2A;color:#fff;font-weight:700;font-size:.88rem;cursor:pointer">Bekijk project</button>
          </div>
        </div>
      </div>
    </div>

    <div style="background:#fff;border-bottom:1px solid #DCE0E6;padding:18px 24px">
      <div style="max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:34px;flex-wrap:wrap">
        <sc-for list="{{ trustPoints }}" as="t" hint-placeholder-count="5">
          <span style="display:inline-flex;align-items:center;gap:9px;font-size:.84rem;font-weight:600;color:#0C1A2A"><span style="width:5px;height:5px;background:#F26522;border-radius:1px"></span>{{ t }}</span>
        </sc-for>
      </div>
    </div>

    <div style="padding:76px 24px 40px;max-width:1120px;margin:0 auto">
      <div style="margin-bottom:40px;max-width:640px">
        <div style="display:inline-block;background:rgba(242,101,34,.1);color:#D4531A;padding:5px 14px;border-radius:2px;font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">Hoe werkt Timmerly</div>
        <h2 style="font-size:clamp(1.7rem,3.2vw,2.2rem);font-weight:600;letter-spacing:-.9px;margin:0">Vier stappen van profiel naar project</h2>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px">
        <sc-for list="{{ howSteps }}" as="s" hint-placeholder-count="4">
          <div style="background:#fff;border:1px solid #DCE0E6;border-radius:2px;padding:22px 20px">
            <div style="width:30px;height:30px;border-radius:50%;background:#F26522;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.88rem;margin-bottom:14px">{{ s.n }}</div>
            <div style="font-weight:700;font-size:1.02rem;margin-bottom:6px">{{ s.title }}</div>
            <div style="font-size:.87rem;color:#6B7280;text-wrap:pretty">{{ s.body }}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="padding:40px 24px 76px;max-width:1120px;margin:0 auto">
      <div style="margin-bottom:32px;max-width:640px">
        <div style="display:inline-block;background:rgba(242,101,34,.1);color:#D4531A;padding:5px 14px;border-radius:2px;font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">Waarom Timmerly</div>
        <h2 style="font-size:clamp(1.7rem,3.2vw,2.2rem);font-weight:600;letter-spacing:-.9px;margin:0">Geen vacaturebank, maar een vaknetwerk</h2>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px 32px">
        <sc-for list="{{ whyPoints }}" as="w" hint-placeholder-count="6">
          <div style="display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid #DCE0E6">
            <span style="width:8px;height:8px;background:#F26522;border-radius:1px;flex-shrink:0;margin-top:7px"></span>
            <span><span style="display:block;font-weight:700;font-size:.98rem;margin-bottom:3px">{{ w.title }}</span><span style="display:block;font-size:.87rem;color:#6B7280">{{ w.body }}</span></span>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="background:#F2F3F5;border-top:1px solid #DCE0E6;border-bottom:1px solid #DCE0E6;padding:64px 24px">
      <div style="max-width:1120px;margin:0 auto">
        <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px">
          <div>
            <div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#8A93A3;font-weight:700;margin-bottom:8px">Actuele projecten</div>
            <h2 style="font-size:clamp(1.5rem,2.8vw,2rem);font-weight:600;letter-spacing:-.7px;margin:0">Waar nu timmermannen gezocht worden</h2>
          </div>
          <button onClick="{{ goProjects }}" style="padding:13px 22px;border-radius:2px;border:1px solid #DCE0E6;background:#fff;color:#0C1A2A;font-weight:700;font-size:.92rem;cursor:pointer">Alle projecten</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px">
          <sc-for list="{{ featuredProjects }}" as="p" hint-placeholder-count="3">
            <div style="background:#fff;border:1px solid #DCE0E6;border-radius:2px;padding:20px;display:flex;flex-direction:column;gap:10px">
              <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><span style="font-weight:700;font-size:1.02rem;letter-spacing:-.2px">{{ p.title }}</span><span style="{{ p.pill }}">{{ p.status }}</span></div>
              <div style="font-size:.86rem;color:#6B7280">{{ p.meta }}</div>
              <div style="display:flex;gap:6px;flex-wrap:wrap">
                <sc-for list="{{ p.work }}" as="w" hint-placeholder-count="3"><span style="background:#F2F3F5;border:1px solid #DCE0E6;color:#0C1A2A;padding:3px 9px;border-radius:2px;font-size:.76rem;font-weight:700">{{ w }}</span></sc-for>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:8px"><span style="font-weight:700;font-size:.92rem">{{ p.rate }}</span><button onClick="{{ p.open }}" style="background:none;border:none;color:#D4531A;font-weight:700;font-size:.88rem;cursor:pointer;padding:0">Bekijk project</button></div>
            </div>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="background:#0C1A2A;padding:72px 24px">
      <div style="max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:40px;align-items:center">
        <div>
          <div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#8A93A3;font-weight:700;color:rgba(255,255,255,.55);margin-bottom:10px">Voor vakmensen</div>
          <h2 style="font-size:clamp(1.7rem,3.2vw,2.3rem);font-weight:600;letter-spacing:-.9px;color:#fff;margin:0 0 14px;text-wrap:pretty">Eén profiel. Passende projecten. Geen gedoe met acquisitie.</h2>
          <p style="color:rgba(255,255,255,.75);font-size:1rem;margin:0 0 26px;max-width:520px;text-wrap:pretty">Je geeft aan wat je doet, waar je werkt en wanneer je kunt. Wij screenen je profiel, stellen je voor bij passende opdrachtgevers en houden contact tijdens het project.</p>
          <button onClick="{{ goOnboard }}" style="padding:15px 26px;border-radius:2px;border:none;background:#F26522;color:#fff;font-weight:700;font-size:1rem;cursor:pointer">Word Timmerly-vakman</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <sc-for list="{{ proBenefits }}" as="b" hint-placeholder-count="4">
            <div style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:2px;padding:14px 16px;color:#fff;font-size:.92rem;display:flex;gap:12px;align-items:center"><span style="width:6px;height:6px;background:#F26522;flex-shrink:0"></span>{{ b }}</div>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="padding:64px 24px">
      <div style="max-width:1120px;margin:0 auto;background:#fff;border:1px solid #DCE0E6;border-radius:2px;padding:36px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap">
        <div style="max-width:600px">
          <div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#8A93A3;font-weight:700;margin-bottom:8px">Voor opdrachtgevers</div>
          <h2 style="font-size:clamp(1.4rem,2.6vw,1.9rem);font-weight:600;letter-spacing:-.6px;margin:0 0 8px">Op zoek naar een timmerman?</h2>
          <p style="color:#6B7280;font-size:.95rem;margin:0;text-wrap:pretty">Meld je project aan. Timmerly beoordeelt de aanvraag, selecteert gescreende vakmensen en regelt de matching. Je ziet alleen kandidaten die wij hebben voorgesteld.</p>
        </div>
        <button onClick="{{ goCon }}" style="padding:13px 22px;border-radius:2px;border:none;background:#F26522;color:#fff;font-weight:700;font-size:.95rem;cursor:pointer">Project aanmelden</button>
      </div>
    </div>
  </div>
  </sc-if>

  <sc-if value="{{ isProjects }}">
  <div data-screen-label="Projecten" style="max-width:1180px;margin:0 auto;padding:40px 24px 64px;width:100%;box-sizing:border-box">
    <div style="margin-bottom:24px">
      <h1 style="font-size:clamp(1.7rem,3vw,2.3rem);font-weight:600;letter-spacing:-.9px;margin:0 0 6px">Projecten voor zzp-timmermannen</h1>
      <div style="color:#6B7280;font-size:.95rem">{{ projectCount }}</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;align-items:start">
      <div style="background:#fff;border:1px solid #DCE0E6;border-radius:2px;padding:18px;display:flex;flex-direction:column;gap:18px;grid-column:span 1">
        <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:700;font-size:.95rem">Filters</span><button onClick="{{ clearFilters }}" style="background:none;border:none;color:#D4531A;font-weight:700;font-size:.82rem;cursor:pointer;padding:0">Wissen</button></div>
        <sc-for list="{{ filterGroups }}" as="g" hint-placeholder-count="5">
          <div>
            <div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#8A93A3;font-weight:700;margin-bottom:8px">{{ g.label }}</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <sc-for list="{{ g.options }}" as="o" hint-placeholder-count="4"><button onClick="{{ o.go }}" style="{{ o.style }}">{{ o.label }}</button></sc-for>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="grid-column:span 2;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;min-width:0">
        <sc-for list="{{ filteredProjects }}" as="p" hint-placeholder-count="6">
          <div style="background:#fff;border:1px solid #DCE0E6;border-radius:2px;padding:20px;display:flex;flex-direction:column;gap:10px">
            <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><span style="font-weight:700;font-size:1.02rem;letter-spacing:-.2px">{{ p.title }}</span><span style="{{ p.pill }}">{{ p.status }}</span></div>
            <div style="font-size:.86rem;color:#6B7280">{{ p.meta }}</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <sc-for list="{{ p.work }}" as="w" hint-placeholder-count="3"><span style="background:#F2F3F5;border:1px solid #DCE0E6;color:#0C1A2A;padding:3px 9px;border-radius:2px;font-size:.76rem;font-weight:700">{{ w }}</span></sc-for>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.82rem;color:#6B7280;padding-top:6px;border-top:1px solid #EDEFF2">
              <span>Specialisme<br /><strong style="color:#0C1A2A">{{ p.spec }}</strong></span>
              <span>Beschikbaarheid<br /><strong style="color:#0C1A2A">{{ p.avail }}</strong></span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto"><span style="font-weight:700;font-size:.92rem">{{ p.rate }}</span><button onClick="{{ p.open }}" style="padding:10px 16px;border-radius:2px;border:none;background:#0C1A2A;color:#fff;font-weight:700;font-size:.85rem;cursor:pointer">Bekijk project</button></div>
          </div>
        </sc-for>
        <sc-if value="{{ noProjects }}" hint-placeholder-val="{{ false }}">
          <div style="grid-column:1/-1;background:#fff;border:1px solid #DCE0E6;border-radius:2px;padding:40px;text-align:center">
            <div style="font-weight:700;font-size:1.05rem;margin-bottom:6px">Geen projecten met deze filters</div>
            <div style="color:#6B7280;font-size:.9rem;margin-bottom:16px">Verruim je reisafstand of kies een andere provincie. Nieuwe projecten komen wekelijks binnen.</div>
            <button onClick="{{ clearFilters }}" style="padding:13px 22px;border-radius:2px;border:1px solid #DCE0E6;background:#fff;color:#0C1A2A;font-weight:700;font-size:.92rem;cursor:pointer">Filters wissen</button>
          </div>
        </sc-if>
      </div>
    </div>
  </div>
  </sc-if>

  <sc-if value="{{ isProject }}">
  <div data-screen-label="Projectdetail" style="max-width:1120px;margin:0 auto;padding:32px 24px 64px;width:100%;box-sizing:border-box">
    <button onClick="{{ goProjects }}" style="background:none;border:none;color:#6B7280;font-weight:600;font-size:.88rem;cursor:pointer;padding:0;margin-bottom:18px">← Alle projecten</button>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start">
      <div style="grid-column:span 2;display:flex;flex-direction:column;gap:16px;min-width:0">
        <div style="background:#fff;border:1px solid #DCE0E6;border-radius:2px;padding:26px">
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px"><span style="{{ detail.pill }}">{{ detail.status }}</span><span style="font-size:.82rem;color:#8A93A3">Geplaatst {{ detail.posted }} · via Timmerly</span></div>
          <h1 style="font-size:clamp(1.6rem,3vw,2.2rem);font-weight:600;letter-spacing:-.8px;margin:0 0 14px">{{ detail.title }}</h1>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px">
            <sc-for list="{{ detail.facts }}" as="f" hint-placeholder-count="4">
              <div style="background:#F2F3F5;border-radius:2px;padding:12px 14px"><div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#8A93A3;font-weight:700;margin-bottom:4px">{{ f.k }}</div><div style="font-weight:700;font-size:.95rem">{{ f.v }}</div></div>
            </sc-for>
          </div>
        </div>
        <div style="background:#fff;border:1px solid #DCE0E6;border-radius:2px;padding:26px">
          <div style="font-weight:700;font-size:1.05rem;margin-bottom:8px">Projectomschrijving</div>
          <p style="font-size:.95rem;color:#4B5563;margin:0 0 20px;text-wrap:pretty">{{ detail.desc }}</p>
          <div style="font-weight:700;font-size:1.05rem;margin-bottom:8px">Werkzaamheden</div>
          <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:20px">
            <sc-for list="{{ detail.work }}" as="w" hint-placeholder-count="3"><span style="display:flex;gap:10px;align-items:center;font-size:.92rem"><span style="width:6px;height:6px;background:#F26522;flex-shrink:0"></span>{{ w }}</span></sc-for>
          </div>
          <div style="font-weight:700;font-size:1.05rem;margin-bottom:10px">Vereisten en voorwaarden</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px">
            <sc-for list="{{ detail.reqs }}" as="r" hint-placeholder-count="8">
              <div style="display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #EDEFF2;padding:9px 0;font-size:.88rem"><span style="color:#6B7280">{{ r.k }}</span><span style="font-weight:700;text-align:right">{{ r.v }}</span></div>
            </sc-for>
          </div>
        </div>
        <div style="background:#fff;border:1px solid #DCE0E6;border-radius:2px;padding:22px">
          <div style="font-weight:700;font-size:1rem;margin-bottom:10px">Belangrijke afspraken</div>
          <div style="display:flex;flex-direction:column;gap:7px">
            <sc-for list="{{ detail.terms }}" as="t" hint-placeholder-count="3"><span style="font-size:.88rem;color:#4B5563">{{ t }}</span></sc-for>
          </div>
        </div>
      </div>
      <div style="background:#fff;border:1px solid #DCE0E6;border-radius:2px;padding:22px;position:sticky;top:90px;display:flex;flex-direction:column;gap:12px">
        <div style="font-size:1.4rem;font-weight:700;letter-spacing:-.4px">{{ detail.rate }}</div>
        <div style="font-size:.86rem;color:#6B7280">{{ detail.availLine }}</div>

                  <sc-for list="{{ candFilters }}" as="f" hint-placeholder-count="4"><button onClick="{{ f.go }}" style="{{ f.style }}">{{ f.label }}</button></sc-for>
                </div>
                <sc-for list="{{ candList }}" as="c" hint-placeholder-count="5">
                  <button onClick="{{ c.go }}" style="{{ c.style }}">
                    <span style="flex:1;min-width:0;text-align:left"><span style="display:block;font-weight:700;font-size:.93rem">{{ c.name }}</span><span style="display:block;font-size:.8rem;color:#6B7280">{{ c.meta }}</span></span>
                    <span style="{{ c.pill }}">{{ c.status }}</span>
                  </button>
                </sc-for>
                <sc-if value="{{ candEmpty }}" hint-placeholder-val="{{ false }}"><div style="background:#fff;border:1px solid #DCE0E6;border-radius:2px;padding:24px;text-align:center;color:#6B7280;font-size:.9rem">Geen kandidaten gevonden.</div></sc-if>
              </div>
              <div style="background:#fff;border:1px solid #DCE0E6;border-radius:2px;padding:22px;display:flex;flex-direction:column;gap:18px">
                <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">
                  <div><div style="font-weight:700;font-size:1.15rem">{{ selCand.name }}</div><div style="font-size:.86rem;color:#6B7280">{{ selCand.meta }}</div></div>
                  <span style="{{ selCand.pill }}">{{ selCand.status }}</span>
                </div>
                <div>
                  <div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#8A93A3;font-weight:700;margin-bottom:8px">Status wijzigen</div>
                  <div style="display:flex;gap:6px;flex-wrap:wrap">
                    <sc-for list="{{ candStatusOpts }}" as="o" hint-placeholder-count="6"><button onClick="{{ o.go }}" style="{{ o.style }}">{{ o.label }}</button></sc-for>
                  </div>
                </div>
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px">
                  <div style="background:#F2F3F5;border-radius:2px;padding:12px"><div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#8A93A3;font-weight:700;margin-bottom:4px">Documenten</div><div style="font-size:.86rem;font-weight:600">{{ selCand.docs }}</div></div>
                  <div style="background:#F2F3F5;border-radius:2px;padding:12px"><div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#8A93A3;font-weight:700;margin-bottom:4px">Beschikbaarheid</div><div style="font-size:.86rem;font-weight:600">{{ selCand.avail }}</div></div>
                  <div style="background:#F2F3F5;border-radius:2px;padding:12px"><div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#8A93A3;font-weight:700;margin-bottom:4px">Projecthistorie</div><div style="font-size:.86rem;font-weight:600">{{ selCand.history }}</div></div>
                </div>
                <label style="display:flex;flex-direction:column;gap:5px">
                  <span style="font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#8A93A3;font-weight:700;">Interne notitie</span>
                  <textarea value="{{ candNote }}" onChange="{{ setCandNote }}" placeholder="Bijv. telefonisch gesproken op 8 sept, VCA opgevraagd" style="width:100%;padding:12px 14px;border:1px solid #DCE0E6;border-radius:2px;font-size:.95rem;color:#0C1A2A;background:#fff;outline:none;box-sizing:border-box;min-height:90px;resize:vertical"></textarea>
                </label>
                <div style="font-size:.78rem;color:#8A93A3">Zichtbaar voor Admin en Recruiter. Statuswijzigingen en notities worden vastgelegd in het auditlog.</div>
              </div>
            </div>
            </sc-if>

            <sc-if value="{{ admProjects }}">
            <div style="display:flex;flex-direction:column;gap:10px">
              <sc-for list="{{ admProjList }}" as="p" hint-placeholder-count="4">
                <div style="background:#fff;border:1px solid #DCE0E6;border-radius:2px;padding:18px;display:flex;flex-direction:column;gap:12px">
                  <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
                    <span style="flex:1;min-width:220px"><span style="display:block;font-weight:700;font-size:.98rem">{{ p.title }}</span><span style="display:block;font-size:.83rem;color:#6B7280">{{ p.meta }}</span></span>
                    <span style="{{ p.pill }}">{{ p.status }}</span>
                    <div style="display:flex;gap:8px">
                      <button onClick="{{ p.next }}" style="padding:9px 16px;border-radius:2px;border:none;background:#0C1A2A;color:#fff;font-weight:700;font-size:.83rem;cursor:pointer">{{ p.nextLabel }}</button>
                      <button onClick="{{ p.match }}" style="padding:9px 16px;border-radius:2px;border:1px solid #DCE0E6;background:#fff;color:#0C1A2A;font-weight:700;font-size:.83rem;cursor:pointer">Kandidaten</button>
                    </div>
                  </div>
                  <div style="display:flex;gap:4px;flex-wrap:wrap">
                    <sc-for list="{{ p.chain }}" as="c" hint-placeholder-count="6"><span style="{{ c.style }}">{{ c.label }}</span></sc-for>
                  </div>
                </div>
              </sc-for>
            </div>
            </sc-if>

            <sc-if value="{{ admMatching }}">
            <div style="display:flex;flex-direction:column;gap:14px">
              <div style="display:flex;gap:6px;flex-wrap:wrap">
                <sc-for list="{{ matchProjOpts }}" as="o" hint-placeholder-count="3"><button onClick="{{ o.go }}" style="{{ o.style }}">{{ o.label }}</button></sc-for>
              </div>
              <div style="background:#fff;border:1px solid #DCE0E6;border-radius:2px;padding:20px">
                <div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#8A93A3;font-weight:700;margin-bottom:6px">Beste matches voor</div>
                <div style="font-weight:700;font-size:1.15rem;margin-bottom:16px">{{ matchProjTitle }}</div>
                <div style="display:flex;flex-direction:column;gap:10px">
                  <sc-for list="{{ bestMatches }}" as="m" hint-placeholder-count="4">
                    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#F2F3F5;border:1px solid #DCE0E6;border-radius:2px;padding:14px">
                      <span style="width:28px;font-weight:700;color:#8A93A3">{{ m.rank }}</span>
                      <span style="{{ m.avatar }}">{{ m.initials }}</span>
                      <span style="flex:1;min-width:200px"><span style="display:block;font-weight:700;font-size:.95rem">{{ m.name }}</span><span style="display:block;font-size:.82rem;color:#6B7280">{{ m.reasons }}</span></span>
                      <span style="font-weight:700;font-size:1.2rem;color:#D4531A">{{ m.score }}</span>
                      <button onClick="{{ m.propose }}" style="{{ m.btnStyle }}">{{ m.btnLabel }}</button>
                    </div>
                  </sc-for>
                </div>
                <div style="margin-top:14px;font-size:.8rem;color:#8A93A3;text-wrap:pretty">Score op specialisme, regio, beschikbaarheid, ervaring en certificaten. Regels staan in een aparte module zodat het algoritme later vervangen kan worden.</div>
              </div>
            </div>
            </sc-if>

            <sc-if value="{{ admAudit }}">
            <div style="background:#fff;border:1px solid #DCE0E6;border-radius:2px;overflow:hidden">
              <div style="display:grid;grid-template-columns:1.2fr 1fr 2fr 1fr;gap:10px;padding:12px 16px;font-size:.71rem;text-transform:uppercase;letter-spacing:.07em;color:#8A93A3;font-weight:700;border-bottom:1px solid #DCE0E6"><span>Wanneer</span><span>Wie</span><span>Wat</span><span>Object</span></div>
              <sc-for list="{{ auditLog }}" as="a" hint-placeholder-count="6">
                <div style="display:grid;grid-template-columns:1.2fr 1fr 2fr 1fr;gap:10px;padding:12px 16px;border-bottom:1px solid #EDEFF2;font-size:.86rem"><span style="color:#6B7280">{{ a.when }}</span><span style="font-weight:600">{{ a.who }}</span><span>{{ a.what }}</span><span style="color:#6B7280">{{ a.obj }}</span></div>
              </sc-for>
            </div>
            </sc-if>
          </div>
          </sc-if>

        </div>
      </div>

      <sc-if value="{{ isPhone }}">
        <nav style="position:sticky;bottom:0;background:#fff;border-top:1px solid #DCE0E6;display:flex;padding:6px 4px 10px">
          <sc-for list="{{ navItems }}" as="it" hint-placeholder-count="4">
            <button onClick="{{ it.go }}" style="{{ it.tabStyle }}">{{ it.short }}</button>
          </sc-for>
        </nav>
      </sc-if>
    </main>
  </div>
</div>
</sc-if>
</template>
<script src="assets/dc-runtime.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
